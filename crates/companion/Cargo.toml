[package]
name = "resume-companion"
version = "0.1.0"
edition = "2021"

[dependencies]
resume-ui = { path = "../ui", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"

[dev-dependencies]
resume-server = { path = "../server", default-features = false }
uuid = { version = "1", features = ["v4"] }

[features]
embed-ui = ["resume-ui/embed-ui"]
