[package]
name = "resume-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
docx-rs = "0.4"
regex = "1"
pdf-extract = "0.12.1"
lopdf = "0.42"
zip = "8.6.0"
quick-xml = "0.42.0"
pdf-writer = "0.15"
fastembed = { version = "7", optional = true }

[features]
default = ["embeddings"]
embeddings = ["dep:fastembed"]
